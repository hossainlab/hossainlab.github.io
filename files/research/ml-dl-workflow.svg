<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>

    <!-- Omics expression matrix -->
    <g id="omics-icon">
      <rect x="-19" y="-15" width="38" height="30" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="-15" y="-11" width="7" height="6" fill="#0ea5e9"/>
      <rect x="-7"  y="-11" width="7" height="6" fill="#bae6fd"/>
      <rect x="1"   y="-11" width="7" height="6" fill="#f59e0b"/>
      <rect x="9"   y="-11" width="6" height="6" fill="#0284c7"/>
      <rect x="-15" y="-3"  width="7" height="6" fill="#fef3c7"/>
      <rect x="-7"  y="-3"  width="7" height="6" fill="#0ea5e9"/>
      <rect x="1"   y="-3"  width="7" height="6" fill="#bae6fd"/>
      <rect x="9"   y="-3"  width="6" height="6" fill="#f59e0b"/>
      <rect x="-15" y="5"   width="7" height="6" fill="#0284c7"/>
      <rect x="-7"  y="5"   width="7" height="6" fill="#fef3c7"/>
      <rect x="1"   y="5"   width="7" height="6" fill="#0ea5e9"/>
      <rect x="9"   y="5"   width="6" height="6" fill="#bae6fd"/>
    </g>

    <!-- Clinical record -->
    <g id="clinical-icon">
      <rect x="-15" y="-17" width="30" height="34" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <line x1="-9" y1="-9" x2="9" y2="-9" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9" y1="-2" x2="9" y2="-2" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9" y1="5"  x2="2" y2="5"  stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="7" cy="9" r="4.5" fill="#10b981"/>
    </g>

    <!-- Genotype / variants -->
    <g id="variant-icon">
      <path d="M -14,-15 C 4,-6 -4,6 14,15" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 14,-15 C -4,-6 4,6 -14,15" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9" y1="-9" x2="9" y2="-9" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-4" y1="0"  x2="4"  y2="0"  stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9" y1="9"  x2="9"  y2="9"  stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Histology / image tile -->
    <g id="image-icon">
      <rect x="-18" y="-15" width="36" height="30" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="-8" cy="-4" r="4.5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="4"  cy="2"  r="5.5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="-7" r="3.5" fill="#10b981" opacity="0.85"/>
      <circle cx="-6" cy="8"  r="3"   fill="#ec4899" opacity="0.85"/>
    </g>
  </defs>

  <rect width="900" height="450" fill="#ffffff" />

  <!-- STEP 1: FEATURE SPACE -->
  <g transform="translate(40, 60)">
    <text x="160" y="20" font-size="20" font-weight="800" fill="#334155" text-anchor="middle">1. Multi-Modal Features</text>
    <rect x="0" y="40" width="320" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#soft-shadow)"/>

    <g transform="translate(25, 75)">
      <!-- Expression -->
      <rect x="0" y="0" width="125" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="62" y="30" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Expression</text>
      <use href="#omics-icon" x="62" y="65" />
      <text x="62" y="100" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Genes x samples</text>

      <!-- Genotype -->
      <rect x="145" y="0" width="125" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="207" y="30" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Genotype</text>
      <use href="#variant-icon" x="207" y="65" />
      <text x="207" y="100" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Variants</text>

      <!-- Clinical -->
      <rect x="0" y="130" width="125" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="62" y="160" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Clinical</text>
      <use href="#clinical-icon" x="62" y="195" />
      <text x="62" y="230" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Phenotypes</text>

      <!-- Imaging -->
      <rect x="145" y="130" width="125" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <text x="207" y="160" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Imaging</text>
      <use href="#image-icon" x="207" y="195" />
      <text x="207" y="230" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Histology tiles</text>
    </g>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(375, 220)">
    <path d="M 0,0 L 45,0" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,5" />
    <polygon points="45,-8 60,0 45,8" fill="#94a3b8"/>
  </g>

  <!-- STEP 2: MODEL TRAINING -->
  <g transform="translate(450, 60)">
    <text x="80" y="20" font-size="20" font-weight="800" fill="#334155" text-anchor="middle">2. Learning</text>
    <rect x="0" y="40" width="160" height="320" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#soft-shadow)"/>

    <g transform="translate(80, 160)">
      <circle r="55" fill="#ffffff" stroke="#2563eb" stroke-width="4" />

      <!-- mini neural network -->
      <g stroke="#93c5fd" stroke-width="1.2" opacity="0.9">
        <line x1="-30" y1="-27" x2="0" y2="-32"/><line x1="-30" y1="-27" x2="0" y2="-16"/><line x1="-30" y1="-27" x2="0" y2="0"/><line x1="-30" y1="-27" x2="0" y2="16"/><line x1="-30" y1="-27" x2="0" y2="32"/>
        <line x1="-30" y1="-9"  x2="0" y2="-32"/><line x1="-30" y1="-9"  x2="0" y2="-16"/><line x1="-30" y1="-9"  x2="0" y2="0"/><line x1="-30" y1="-9"  x2="0" y2="16"/><line x1="-30" y1="-9"  x2="0" y2="32"/>
        <line x1="-30" y1="9"   x2="0" y2="-32"/><line x1="-30" y1="9"   x2="0" y2="-16"/><line x1="-30" y1="9"   x2="0" y2="0"/><line x1="-30" y1="9"   x2="0" y2="16"/><line x1="-30" y1="9"   x2="0" y2="32"/>
        <line x1="-30" y1="27"  x2="0" y2="-32"/><line x1="-30" y1="27"  x2="0" y2="-16"/><line x1="-30" y1="27"  x2="0" y2="0"/><line x1="-30" y1="27"  x2="0" y2="16"/><line x1="-30" y1="27"  x2="0" y2="32"/>
        <line x1="0" y1="-32" x2="30" y2="-12"/><line x1="0" y1="-32" x2="30" y2="12"/>
        <line x1="0" y1="-16" x2="30" y2="-12"/><line x1="0" y1="-16" x2="30" y2="12"/>
        <line x1="0" y1="0"   x2="30" y2="-12"/><line x1="0" y1="0"   x2="30" y2="12"/>
        <line x1="0" y1="16"  x2="30" y2="-12"/><line x1="0" y1="16"  x2="30" y2="12"/>
        <line x1="0" y1="32"  x2="30" y2="-12"/><line x1="0" y1="32"  x2="30" y2="12"/>
      </g>
      <g fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5">
        <circle cx="-30" cy="-27" r="5"/><circle cx="-30" cy="-9" r="5"/><circle cx="-30" cy="9" r="5"/><circle cx="-30" cy="27" r="5"/>
      </g>
      <g fill="#ffffff" stroke="#2563eb" stroke-width="2">
        <circle cx="0" cy="-32" r="5"/><circle cx="0" cy="-16" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="0" cy="16" r="5"/><circle cx="0" cy="32" r="5"/>
      </g>
      <g fill="#10b981" stroke="#047857" stroke-width="1.5">
        <circle cx="30" cy="-12" r="5"/><circle cx="30" cy="12" r="5"/>
      </g>

      <circle r="65" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2,12" stroke-linecap="round"/>
    </g>

    <text x="80" y="272" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Feature Selection</text>
    <text x="80" y="295" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">Cross-Validation</text>
    <text x="80" y="318" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Hyperparameter Tuning</text>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(625, 220)">
    <path d="M 0,0 L 45,0" stroke="#3b82f6" stroke-width="4" />
    <polygon points="45,-8 60,0 45,8" fill="#3b82f6"/>
  </g>

  <!-- STEP 3: EVALUATED PREDICTOR -->
  <g transform="translate(700, 60)">
    <text x="100" y="20" font-size="20" font-weight="800" fill="#334155" text-anchor="middle">3. Predictive Model</text>
    <rect x="0" y="40" width="200" height="320" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" filter="url(#soft-shadow)"/>

    <g transform="translate(20, 90)">
      <rect x="-4" y="0" width="168" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

      <!-- ROC curves -->
      <g transform="translate(28, 18)">
        <line x1="0" y1="0" x2="0" y2="104" stroke="#94a3b8" stroke-width="2"/>
        <line x1="0" y1="104" x2="116" y2="104" stroke="#94a3b8" stroke-width="2"/>
        <line x1="0" y1="104" x2="104" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

        <path d="M 0,104 C 6,46 32,14 104,4" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 0,104 C 12,60 42,26 104,10" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
        <path d="M 0,104 C 22,72 54,42 104,18" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

        <text x="68" y="76" font-size="14" font-weight="900" fill="#065f46">AUC</text>
        <text x="68" y="94" font-size="13" font-weight="700" fill="#059669">0.91</text>
      </g>

      <text x="80" y="168" font-size="14" font-weight="800" fill="#065f46" text-anchor="middle">ROC / Discrimination</text>
    </g>

    <g transform="translate(100, 300)">
      <text font-size="13" font-weight="700" fill="#166534" text-anchor="middle">External Validation</text>
      <text y="22" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Interpretable (SHAP)</text>
    </g>
  </g>
</svg>
