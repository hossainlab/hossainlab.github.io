            - generic [ref=f1e226]: Why public scRNA-seq data?
            - text: Public single-cell datasets from
            - strong [ref=f1e227]: CellxGene, GEO, and the Human Cell Atlas
            - text: allow cross-cohort atlas construction at a scale impossible for a single lab. Integrating multiple studies removes batch-specific noise, reveals conserved cell states across diseases, and enables discovery of rare populations with unprecedented statistical confidence.
