            - strong [ref=f4e98]: Scale
            - paragraph [ref=f4e99]: Thousands of samples across tissues, diseases, and cohorts — far beyond single-lab capacity.
          - generic [ref=f4e105]:
            - strong [ref=f4e106]: Open Science
            - paragraph [ref=f4e107]: FAIR data principles enable cross-study meta-analyses and collaborative discovery.
          - generic [ref=f4e113]:
            - strong [ref=f4e114]: Generalisability
            - paragraph [ref=f4e115]: Multi-cohort validation increases confidence that findings are not dataset-specific artefacts.
