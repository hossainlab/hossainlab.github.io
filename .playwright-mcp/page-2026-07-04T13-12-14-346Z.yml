            - paragraph [ref=f3e75]: Jubayer Hossain is a bioinformatician, researcher, educator, and entrepreneur working at the interface of machine learning, single-cell genomics, and public-health informatics. He is the Founder and CEO of DeepBio Limited, a Bangladesh-based research startup transforming biological data into solutions for global health, where he leads a team executing scRNA-seq and bulk RNA-seq pipelines for cancer genomics and biomarker discovery. His current research integrates diverse single-cell datasets into a harmonized cell atlas — leveraging publicly available data and deep generative modeling (scVI) to build a comprehensive reference for cellular heterogeneity in health and disease. He is also the founder of DeepBio Academy, an EdTech platform democratizing computational-biology training, and CHIRAL Bangladesh, a non-profit research institute spanning bioinformatics, public health, geospatial health, and AI-healthcare. He has published 20+ peer-reviewed articles and 40+ conference papers, supervised 15+ manuscripts, and trained over 3,000 early-career researchers across South Asia — collaborating with institutions including Michigan State University on biomedical research capacity-building.
