            - paragraph [ref=f1e70]: Jubayer Hossain is a bioinformatician, educator, and founder of DeepBio Limited, DeepBio Academy, and CHIRAL Bangladesh. His research applies deep generative modeling (scVI) to integrate publicly available single-cell datasets into harmonized cell atlases, building comprehensive references for cellular heterogeneity in cancer and neurodegenerative disease. Alongside his research, he leads bioinformatics workflows for biomarker discovery and AI-integrated multi-omics infrastructure. As an educator, he has trained more than 3,000 early-career researchers across South Asia in data science and computational biology, and has published 20+ peer-reviewed articles in Q1/Q2 journals.
