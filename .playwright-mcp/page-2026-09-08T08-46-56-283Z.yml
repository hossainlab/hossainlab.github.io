        - heading "Jubayer Hossain" [level=1] [ref=f9e33]
        - paragraph [ref=f9e34]: Multiomics scientist decoding cancer biology from public transcriptomic data.
        - generic [ref=f9e35]:
          - paragraph [ref=f9e36]: I build reproducible computational workflows on public omics data — meta-analysing bulk RNA-Seq cohorts, constructing harmonised single-cell atlases, and applying machine learning to high-dimensional data for biomarker discovery.
          - paragraph [ref=f9e37]:
            - text: I founded
            - link "DeepBio Limited" [ref=f9e38] [cursor=pointer]:
              - /url: https://deepbioltd.com/
            - text: ", a Dhaka-based AI and bioinformatics company, and"
            - link "CHIRAL Bangladesh" [ref=f9e39] [cursor=pointer]:
              - /url: https://chiralbd.org/
            - text: ", a non-profit research institute that has trained 3,000+ early-career researchers. I teach through"
            - link "DeepBio Academy" [ref=f9e40] [cursor=pointer]:
              - /url: https://deepbioacademy.com/
            - text: and mentor students from raw sequencing data to published analysis.
