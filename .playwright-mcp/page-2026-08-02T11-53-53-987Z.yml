            - strong [ref=f2e98]: Scale
            - paragraph [ref=f2e99]: Thousands of samples across tissues, diseases, and cohorts — far beyond single-lab capacity.
          - generic [ref=f2e105]:
            - strong [ref=f2e106]: Open Science
