      - generic [ref=f2e309]:
        - generic [ref=f2e310]: Why ML/DL on public omics data?
        - text: High-dimensional omics data (10,000+ features per sample) exceeds the capacity of classical statistics. Machine learning extracts
        - strong [ref=f2e311]: non-linear, multi-feature patterns
        - text: that predict disease status, prognosis, and drug response. Public datasets provide the large, diverse sample sizes required to train generalisable models — with SHAP enabling biological interpretability.
