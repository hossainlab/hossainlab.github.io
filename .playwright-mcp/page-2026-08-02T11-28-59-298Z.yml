        - strong [ref=f2e199]: 100,000+ RNA-seq samples
        - text: across diseases, tissues, and treatment conditions. Meta-analysing these datasets reveals robust, cross-cohort differential expression signals that no single study can provide — dramatically increasing statistical power and biological generalisability.
