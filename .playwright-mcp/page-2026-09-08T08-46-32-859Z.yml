        - paragraph [ref=f7e32]: Multiomics · Cancer Genomics · Machine Learning
        - heading "Jubayer Hossain" [level=1] [ref=f7e33]
        - paragraph [ref=f7e34]: Multiomics scientist decoding cancer biology from public transcriptomic data.
        - generic [ref=f7e35]:
          - paragraph [ref=f7e36]: I build reproducible computational workflows on public omics data — meta-analysing bulk RNA-Seq cohorts, constructing harmonised single-cell atlases, and applying machine learning to high-dimensional data for biomarker discovery.
          - paragraph [ref=f7e37]:
            - text: I founded
            - link "DeepBio Limited" [ref=f7e38] [cursor=pointer]:
              - /url: https://deepbioltd.com/
            - text: ", a Dhaka-based AI and bioinformatics company, and"
            - link "CHIRAL Bangladesh" [ref=f7e39] [cursor=pointer]:
              - /url: https://chiralbd.org/
            - text: ", a non-profit research institute that has trained 3,000+ early-career researchers. I teach through"
            - link "DeepBio Academy" [ref=f7e40] [cursor=pointer]:
              - /url: https://deepbioacademy.com/
            - text: and mentor students from raw sequencing data to published analysis.
