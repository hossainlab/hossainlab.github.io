        - heading "Jubayer Hossain" [level=1] [ref=f3e31]
        - paragraph [ref=f3e32]: Multiomics scientist decoding cancer biology from public transcriptomic data.
        - generic [ref=f3e33]:
          - paragraph [ref=f3e34]: I build reproducible computational workflows on public omics data — meta-analysing bulk RNA-Seq cohorts, constructing harmonised single-cell atlases, and applying machine learning to high-dimensional data for biomarker discovery.
          - paragraph [ref=f3e35]:
            - text: I founded
            - link "DeepBio Limited" [ref=f3e36] [cursor=pointer]:
              - /url: https://deepbioltd.com/
            - text: ", a Dhaka-based AI and bioinformatics company, and"
            - link "CHIRAL Bangladesh" [ref=f3e37] [cursor=pointer]:
              - /url: https://chiralbd.org/
            - text: ", a non-profit research institute that has trained 3,000+ early-career researchers. I teach through"
