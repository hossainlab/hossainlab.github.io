          - generic [ref=f5e97]:
            - strong [ref=f5e98]: Scale
            - paragraph [ref=f5e99]: Thousands of samples across tissues, diseases, and cohorts — far beyond single-lab capacity.
          - generic [ref=f5e105]:
            - strong [ref=f5e106]: Open Science
            - paragraph [ref=f5e107]: FAIR data principles enable cross-study meta-analyses and collaborative discovery.
          - generic [ref=f5e113]:
            - strong [ref=f5e114]: Generalisability
            - paragraph [ref=f5e115]: Multi-cohort validation increases confidence that findings are not dataset-specific artefacts.
