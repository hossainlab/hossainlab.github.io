<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="gc-ngdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#gc-ngdd)" />

  <!-- Neural network + molecule motif -->
  <g transform="translate(200, 108)">
    <!-- Neural network nodes/edges (AI) -->
    <line x1="-70" y1="-30" x2="-20" y2="-10" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
    <line x1="-70" y1="10" x2="-20" y2="-10" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
    <line x1="-70" y1="10" x2="-20" y2="20" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
    <line x1="-70" y1="-30" x2="-20" y2="20" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
    <circle cx="-70" cy="-30" r="6" fill="#4f46e5" />
    <circle cx="-70" cy="10" r="6" fill="#4f46e5" />
    <circle cx="-20" cy="-10" r="6" fill="#6366f1" />
    <circle cx="-20" cy="20" r="6" fill="#6366f1" />

    <!-- Molecule (drug) -->
    <circle cx="45" cy="-15" r="9" fill="#0ea5e9" opacity="0.85" />
    <circle cx="75" cy="5" r="9" fill="#0ea5e9" opacity="0.85" />
    <circle cx="45" cy="25" r="9" fill="#0ea5e9" opacity="0.85" />
    <line x1="45" y1="-15" x2="75" y2="5" stroke="#0369a1" stroke-width="2" />
    <line x1="75" y1="5" x2="45" y2="25" stroke="#0369a1" stroke-width="2" />
    <line x1="45" y1="-15" x2="45" y2="25" stroke="#0369a1" stroke-width="2" />

    <!-- Connector from AI to molecule -->
    <line x1="-20" y1="5" x2="36" y2="5" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4 3" />
    <polygon points="36,5 26,0 26,10" fill="#6d28d9" />
  </g>

  <text x="200" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#312e81">NextGen Drug Discovery</text>
  <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">with AI</text>
</svg>
