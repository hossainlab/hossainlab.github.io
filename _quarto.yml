project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!academic-cv/"
    - "!cv/"
  resources:
    - robots.txt
    # cv/ is excluded from render; the navbar links straight at this PDF, so it
    # must be copied as a resource or a full render drops it from docs/.
    - cv/CV-HossainMJ.pdf

# Meta
description-meta: "Academic Website for Jubayer Hossain"
author-meta: "Jubayer Hossain"

website:
  page-navigation: true
  title: "Jubayer Hossain - Multiomics and Machine Learning"
  image: "files/profiles/jubayer.jpg"
  favicon: "/files/profiles/icon.png"
  description: "Academic Website for Jubayer Hossain"

  page-footer:
    left: "&copy; 2026 Jubayer Hossain"
    # The navbar is anchors-only, so every full page is reachable from here.
    center:
      - text: "Research"
        href: research/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "Tutorials"
        href: tutorials/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "About"
        href: about/index.qmd
    right:
      - icon: twitter
        aria-label: Twitter
        href: https://twitter.com/hossain_lab
        target: _blank
      - icon: youtube
        aria-label: YouTube
        href: https://www.youtube.com/@hossainlab
        target: _blank
      - icon: rss
        aria-label: Blog RSS feed
        href: blog/index.xml

  site-url: "https://mdjubayerhossain.com/"
  repo-url: https://github.com/hossainlab/hossainlab.github.io
  reader-mode: false
  draft-mode: unlinked

  open-graph: true
  twitter-card:
    creator: "@hossain_lab"
    card-style: summary_large_image

  search: false

  google-analytics:
    tracking-id: "G-4KLN6W9N3N"
    anonymize-ip: true

  navbar:
    title: false
    pinned: true
    # Section anchors on the homepage, root-absolute so they also work from
    # an inner page. The full pages live in the footer.
    left:
      - href: index.qmd
        text: Home
      - href: "/#featured"
        text: Work
      - href: "/#talks"
        text: Talks
      - href: "/#tutorials"
        text: Tutorials
      - href: "/#publications"
        text: Publications
      - href: "/#news"
        text: News
format:
  html:
    theme:
      light: [cosmo, _theme/custom-light.scss]
      dark: [cosmo, _theme/custom-dark.scss]
    css: styles.css
    toc: true
    toc-expand: 1
    mermaid:
      theme: neutral
    include-in-header:
      - _includes/schema-person.html
      - _includes/bibtex-copy.html



