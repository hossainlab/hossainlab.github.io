    - PyTorch
    - RDKit
    - ChEMBL
    - SHAP
  links:
    - label: "GitHub"
      url: "https://github.com/hossainlab/amr_drug_repurposing"

- path: ""
  title: "TAM-Atlas: Tumor-Associated Macrophage Heterogeneity Across Cancers"
  image: "../files/projects/tam-atlas.svg"
  image-alt: "TAM-Atlas"
  description: "A computational framework analyzing tumor-associated macrophage (TAM) heterogeneity across 8 cancer types to predict immunotherapy response using single-cell transcriptomics. Integrates ~640,000 cells from published datasets through a seven-phase pipeline, identifying 6 conserved macrophage states and linking SPP1+ and TREM2+ populations to checkpoint inhibitor resistance. Employs scVI deep generative modeling, gene regulatory network inference, and Open Targets druggability prioritization."
  categories:
    - Single-Cell
    - Cancer Genomics
  tags:
    - Python
    - Scanpy
    - scVI-tools
    - Pan-Cancer
    - Tumor Immunology
  links:
    - label: "GitHub"
      url: "https://github.com/hossainlab/TAM-Atlas"

- path: ""
  title: "Single-Cell Atlas of COVID-19 Lung Pathology"
  image: "../files/projects/covid19-lung-atlas.svg"
  image-alt: "COVID-19 Lung Atlas"
  description: "Reanalysis of single-nucleus RNA-seq data from Melms et al. (2021) examining lung tissue from 26 COVID-19 patients and healthy controls. Identifies myeloid expansion, epithelial depletion, and pro-fibrotic remodeling across 94,027 cells using scVI batch correction and Leiden clustering, with an interactive 8-tab Shiny app for exploring gene expression and cell-cell interactions."
  categories:
    - Single-Cell
  tags:
    - Python
    - Scanpy
    - scVI-tools
    - R/Shiny
  links:
