# Research projects. Rendered in full on projects/index.qmd via
# _templates/project-card.ejs.
#
# Homepage "Selected Projects" section reads the same file through
# _templates/home-project-card.ejs, which shows only entries with
# `featured: true`, sorted by `featured-order`, and prefers the short
# `summary` over the long `description`. To swap a homepage card, move
# those three keys to another entry -- no template edit needed.
#
# An entry with no `links:` renders a card that points at the projects page
# instead of an external button; add the repo or DOI under `links:` when it
# is ready.
- path: ""
  title: "EWSAtlas: A Single-Cell Atlas of Ewing Sarcoma"
  featured: true
  featured-order: 1
  summary: "Harmonised single-cell transcriptomics atlas of human Ewing sarcoma, integrating published tumour datasets into one reference."
  description: "A harmonised single-cell transcriptomics atlas of human Ewing sarcoma (EWS). Published tumour datasets are integrated into a common reference to chart malignant and microenvironmental cell states, characterise EWS-FLI1-driven transcriptional programmes, and provide a reusable resource for downstream analysis."
  categories:
    - Single-Cell
    - Cancer Genomics
  tags:
    - Python
    - Scanpy
    - Atlas
    - Ewing Sarcoma
  links:
    - label: "GitHub"
      url: "https://github.com/hossainlab/EWSAtlas"

