  "abstract": "Thyroid cancer, the most prevalent endocrine malignancy globally, poses challenges owing to the limited understanding of its molecular drivers. Previous research has highlighted collagen genes, such as COL13A1 and COL23A1, as key players in thyroid cancer. This study aimed to comprehensively investigate gene expression, genetic alterations, DNA methylation, and the prognostic significance of COL13A1 and COL23A1.\n\nThis study employed a multi-omics strategy leveraging the TCGA database and the following resources: TIMER2.0, GEPIA2, UALCAN, HPA, cBioPortal, STRING, Enrichr, Kaplan-Meier Plotter, and R programming.\n\nWe observed distinct expression patterns for COL13A1 and COL23A1. COL13A1 was significantly upregulated, while COL23A1 was downregulated in tumor tissues compared to normal tissues. Expression levels vary by sample type, tumor stage, and histology, with higher COL13A1 staining intensity and moderate COL23A1 staining observed in tumors. Both decreased COL13A1 and increased COL23A1 expression have been linked to poor prognosis. Promoter methylation levels also differ, showing higher COL23A1 methylation in tumors. SGIP1 and SLC26A4 were identified as the most co-expressed genes. Functional validation using GEO datasets further supported the potential of COL13A1 and COL23A1 as prognostic markers in thyroid cancer.\n\nIn thyroid cancer, COL13A1 and COL23A1 have emerged as diagnostic and prognostic markers. Co-expression analysis suggests interactions between SGIP1 and SLC26A4, implicating diverse pathways in thyroid carcinogenesis and informing precision medicine strategies."
