  "abstract": "BACKGROUND: Rainbow trout (Oncorhynchus mykiss), a commercial aquaculture species, experiences physiological stress under environmental challenges. While several bulk RNA-Seq studies have investigated heat and hypoxic stress responses in rainbow trout, a comprehensive analysis identifying common genes and pathways is still lacking. This study addresses this need by analyzing four public RNA-Seq datasets from O. mykiss to identify conserved molecular responses to these stress. RESULT: The meta-analysis identified 1,006 (555 upregulated and 451 downregulated) protein-coding differentially expressed genes (DEGs). Among them, five genes, cdkn1ba, znf395a, klf9, irs2b, and tsc22d3, were commonly regulated under both stress conditions, indicating their shared roles in cellular homeostasis. The meta-analysis revealed highly regulated heat shock protein (hsp) family genes and hypoxia-inducible factor (HIF) genes. Gene ontology (GO) enrichment analysis revealed that DEGs under heat and hypoxia stress were associated primarily with the cell cycle, DNA metabolic processes, catalytic activity, and membrane components. Pathway enrichment of these genes revealed coordinated activation of protein processing in the endoplasmic reticulum, p53-mediated cell-cycle arrest, FoxO signaling and oxidative stress responses, indicating a shared core program for proteostasis and damage control. CONCLUSION: This meta-analysis revealed conserved gene expression patterns and key regulatory pathways driving rainbow trout adaptation to heat and hypoxia, providing valuable insights for enhancing stress resistance in aquaculture."
