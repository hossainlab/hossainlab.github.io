  "abstract": "Antibiotic resistance presents a significant global public health challenge, particularly for urinary tract infections (UTIs), and is notably severe in developing countries. Surveillance of the antimicrobial susceptibility patterns of UTI-causing bacteria is crucial for effective treatment selection. This study aimed to analyze these patterns in bacteria isolated from the urine samples of patients at Mughda Medical College Hospital, Dhaka, Bangladesh.\n\nA retrospective study (January 2019 to December 2020) at Mugdha Medical College and Hospital, Dhaka, examined clinical and laboratory data from patients with positive urine cultures (≥10CFU/mL). The study classified patients into four age groups: children (1-<18 years), young adults (18-<33 years), middle-aged adults (33-50 years), and old adults (>50 years). The standard Kirby-Bauer method was used to assess antibiotic sensitivity to 28 common antibiotics.\n\nAmong 243 positive urine cultures in both community- and hospital-acquired UTIs,was the most common uropathogen (65.84%), followed byspp. (12.34%),spp. (8.23%), and other types of bacteria.\n\nOld adults are particularly vulnerable to UTIs, withbeing the predominant causative agent in the study region. The observed antimicrobial resistance patterns underscore the necessity of judicious antibiotic selection to effectively treat UTIs across different age groups."
