  "abstract": "Dengue is a major public health concern in Bangladesh. This study aimed to assess the perceptions and practices of community members in Dhaka regarding community engagement and social participation for dengue prevention.\n\nA cross-sectional online survey was conducted in Dhaka City from May 2022 to December 2022. The respondents were randomly selected. The association between community participation and prevention practices was tested using thetest.\n\nThe findings of this study indicate that the majority of participants (92%) believed that community effort would be relied upon in the event of a dengue outbreak. Environmental cleaning campaigns were the preferred approach, and religious leaders viewed them positively. This study also revealed significant variations in knowledge levels, with those involved in community efforts and mass gatherings demonstrating greater knowledge. This study sheds light on the demographic factors that influence dengue knowledge and provides valuable insights into the development of targeted public health interventions.\n\nThe study revealed negative perceptions and limited participation in dengue prevention among participants, with the majority demonstrating a poor understanding of preventive measures. While some showed positive attitudes towards community engagement, significant disparities existed in participation, highlighting the need for targeted educational campaigns and enhanced community mobilization efforts. Moreover, the importance of multisectoral collaboration is emphasized, underscoring the need for coordinated efforts among health departments, NGOs, religious institutions, and community leaders to effectively combat dengue transmission. Recommendations include ongoing educational initiatives, targeted interventions to promote community involvement, and fostering collaboration across sectors to strengthen dengue prevention efforts and to safeguard public health."
