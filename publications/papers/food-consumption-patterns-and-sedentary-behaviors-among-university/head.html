  "abstract": "University is a critical period regarding unhealthy changes in eating behaviors in students. University students often face significant changes in their eating habits and physical activity levels, which can impact their overall health.\n\nTo investigate the eating habits and sedentary behavior of university students in Dhaka.\n\nThis research was based on a cross-sectional study. The snowball sampling technique was applied to survey university students in Dhaka city. Structured questionnaires were used for data collection through an online survey. Data collection was done from November 2022 to April 2023. Descriptive statistics, including frequency, percentage, mean, and standard deviation (SD), were computed for the variables of interest. Chi-squared test was performed to estimate the association between the participants' eating habits, sedentary behaviors, and BMI and eating habits. In all analyses, a-value of < 0.05 was considered statistically significant.\n\nA total of 444 students participated in this study; 44% of them consumed breakfast irregularly. Only 25% of students favored vegetables. About 55% of students preferred junk food. Furthermore, only 19% of students consumed fruits daily. This study also found that a substantial proportion of students used the internet and mobile phones for long periods and didn't practice physical activity. According to the Chi-squared test, dinner habits ( < 0.001), smoking status ( < 0.001), alcohol consumption ( = 0.014), watching television ( = 0.023), and practicing physical activity ( = 0.023) had a significant association with eating habits and sedentary behaviors amongst the participants.\n\nOverall, most participants in this study exhibited commendable dietary patterns, except for meal frequency, fruit intake, consumption of junk food, and fried food. However, their physical activity levels were notably inadequate, largely characterized by a sedentary lifestyle involving substantial internet and mobile phone usage."
